# DTU 0.6.9. Preparation is not qualification. Launch only after resource allocation.
# No providers, CLI/Foundation imports, inference, host mounts, public ports or mocks.
# The real server runs directly in its service, not its retired deployment stack.
name: ci-hook-media
x-dtu:
  description: Exact-source installed Core hook to real authenticated CI server and Neo4j/APOC
  twin_machine: twin
services:
  neo4j:
    image: neo4j:5.26.22-community
    environment:
      NEO4J_AUTH: neo4j/${CI_QUALIFICATION_NEO4J_PASSWORD:?allocate an isolated password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN apoc.version()' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 40
    volumes:
      - neo4j-data:/data
  server:
    build:
      context: .
      target: server
    user: "1000:1000"
    environment:
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J_URL: bolt://neo4j:7687
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J_USER: neo4j
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_NEO4J_PASSWORD: ${CI_QUALIFICATION_NEO4J_PASSWORD:?allocate an isolated password}
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_API_KEY: ${CI_QUALIFICATION_TOKEN:?allocate an isolated bearer token}
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_AUTH_MODE: static
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_ACCESS_CONTROL_MODE: compatibility
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_SERVER_HOST: 0.0.0.0
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_SERVER_PORT: "8000"
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_BLOB_PATH: /state/blobs
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_QUEUES_PATH: /state/queues
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_LOG_PATH: /state/server.jsonl
      AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_SPOOL_STATS_REFRESH_INTERVAL_SECONDS: "1"
      WEB_CONCURRENCY: "1"
    command: ["python", "/qualification/start_server.py"]
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/qualification/readiness.py"]
      interval: 5s
      timeout: 10s
      retries: 40
    mem_limit: 1g
    cpus: 1
    volumes:
      - server-state:/state
  twin:
    build:
      context: .
      target: hook
    user: "1000:1000"
    working_dir: /home/user
    environment:
      CI_QUALIFICATION_TOKEN: ${CI_QUALIFICATION_TOKEN:?allocate an isolated bearer token}
      AMPLIFIER_CONTEXT_INTELLIGENCE_BASE_PATH: /home/user/qualification/captures
    command: ["sleep", "infinity"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/qualification/qualify.py", "preflight"]
      interval: 5s
      timeout: 10s
      retries: 5
    mem_limit: 1g
    cpus: 1
    volumes:
      - server-state:/backend-state:ro
volumes:
  neo4j-data:
  server-state:
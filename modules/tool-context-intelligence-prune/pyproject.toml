[project]
name = "amplifier-module-tool-context-intelligence-prune"
version = "0.1.0"
description = "Explicit local raw-payload retention CLI over the Context Intelligence library"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "amplifier-bundle-context-intelligence @ git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main",
    "click>=8.1,<9",
]

[project.scripts]
context-intelligence-prune = "amplifier_module_tool_context_intelligence_prune.cli:main"
amplifier-event-prune = "amplifier_module_tool_context_intelligence_prune.cli:main"
context-intelligence-prune-schedule = "amplifier_module_tool_context_intelligence_prune.scheduled_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_context_intelligence_prune"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
amplifier-bundle-context-intelligence = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.14", "pyright>=1.1.411"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["amplifier_module_tool_context_intelligence_prune", "tests"]
extraPaths = ["../.."]
venvPath = "../.."
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 100
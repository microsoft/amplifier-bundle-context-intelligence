[project]
name = "amplifier-module-tool-context-intelligence-upload"
version = "0.1.3"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "amplifier-bundle-context-intelligence @ git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main",
    "azure-identity>=1.19",
    "httpx>=0.28.1",
    "idna>=3.15",
    "amplifier-module-hook-context-intelligence",
    "pyyaml>=6.0",
]

[project.scripts]
context-intelligence-upload = "amplifier_module_tool_context_intelligence_upload.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_context_intelligence_upload"]

[tool.hatch.metadata]
# Required to build a wheel that carries a PEP 508 direct-reference (git+https) dependency.
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "ruff>=0.4",
    "types-pyyaml>=6.0",
]

[tool.uv.sources]
# The bundle is declared as a PEP 508 direct git reference in [project.dependencies]
# (survives `uv pip install --no-sources`); it is intentionally NOT a path source here.
amplifier-module-hook-context-intelligence = { path = "../hook-context-intelligence", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py311"
line-length = 100

[project]
name = "amplifier-module-tool-context-intelligence-upload"
version = "0.1.0"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "httpx>=0.28.1",
    "amplifier-module-hook-context-intelligence",
]

[project.entry-points."amplifier.modules"]
tool-context-intelligence-upload = "amplifier_module_tool_context_intelligence_upload:mount"

[project.scripts]
context-intelligence-upload = "amplifier_module_tool_context_intelligence_upload.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_context_intelligence_upload"]

[dependency-groups]
dev = [
    "amplifier-core",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.uv.sources]
amplifier-core = { git = "https://github.com/microsoft/amplifier-core", branch = "main" }
amplifier-module-hook-context-intelligence = { path = "../hook-context-intelligence", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py311"
line-length = 100

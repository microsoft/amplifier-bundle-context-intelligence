[project]
name = "amplifier-module-stub-event-contributor"
version = "0.1.0"
description = "DTU test fixture: contributes a non-kernel event via observability.events"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "amplifier-core>=1.4.1",
]

[project.entry-points."amplifier.modules"]
stub-event-contributor = "amplifier_module_stub_event_contributor:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_stub_event_contributor"]

[tool.uv]
package = true

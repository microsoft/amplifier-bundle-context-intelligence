[project]
name = "amplifier-module-tool-context-intelligence-set-filters"
version = "0.1.0"
description = "Same-session ingestion filter tool - make a destination include/exclude change take effect live, without a restart"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "amplifier-bundle-context-intelligence @ git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main",
]

[project.entry-points."amplifier.modules"]
tool-context-intelligence-set-filters = "amplifier_module_tool_context_intelligence_set_filters:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_context_intelligence_set_filters"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "amplifier-core>=1.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.411",
    "ruff>=0.14",
]

[tool.ruff]
target-version = "py311"
line-length = 100

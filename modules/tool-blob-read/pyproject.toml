[project]
name = "amplifier-module-tool-blob-read"
version = "0.1.0"
description = "Blob read tool — reads binary/text blobs from the context-intelligence server"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "amplifier-bundle-context-intelligence",
    "httpx>=0.28.1",
    "idna>=3.15",
]

[project.entry-points."amplifier.modules"]
tool-blob-read = "amplifier_module_tool_blob_read:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_blob_read"]

[dependency-groups]
dev = [
    "amplifier-core",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "ruff>=0.4",
]

[tool.uv.sources]
amplifier-bundle-context-intelligence = { path = "../..", editable = true }
amplifier-core = { git = "https://github.com/microsoft/amplifier-core", branch = "main" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py311"
line-length = 100

[project]
name = "amplifier-module-tool-context-intelligence-transcript"
version = "0.1.1"
description = "Bounded native Context Intelligence transcript retrieval"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "amplifier-bundle-context-intelligence @ git+https://github.com/microsoft/amplifier-bundle-context-intelligence@2818e0519f1c59c71d6a5b53eee50592853f8d7e",
]

[project.entry-points."amplifier.modules"]
tool-context-intelligence-transcript = "amplifier_module_tool_context_intelligence_transcript:mount"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["amplifier_module_tool_context_intelligence_transcript"]

[tool.hatch.metadata]
# Required to build a wheel that carries a PEP 508 direct-reference (git+https) dependency.
allow-direct-references = true

[dependency-groups]
dev = [
    "amplifier-core>=1.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pyright>=1.1.411",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
extraPaths = ["../.."]

[tool.ruff]
target-version = "py311"
line-length = 100
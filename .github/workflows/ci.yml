name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal read-only token — no secrets needed or exposed.
# Safe for Dependabot PRs and external fork contributors.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Code quality checks — ruff format + lint on the root package
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --frozen --only-group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

  # ──────────────────────────────────────────────────────────────────────────
  # Root package tests across supported Python versions
  # ──────────────────────────────────────────────────────────────────────────
  test-root:
    name: Tests — root (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        # --frozen: use the lockfile exactly as committed; fail if it would
        # need updating. This ensures Dependabot bumps are tested as-proposed.
        run: uv sync --frozen

      - name: Run tests
        # Skip tests/dtu — those require live Digital Twin Universe infrastructure
        run: uv run pytest tests/ -q --tb=short --ignore=tests/dtu

  # ──────────────────────────────────────────────────────────────────────────
  # Per-module tests — each module owns its own uv.lock, so each gets
  # its own job. Dependabot bumps a single module's lockfile; this matrix
  # ensures the affected module is always tested.
  # ──────────────────────────────────────────────────────────────────────────
  test-modules:
    name: Tests — ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - hook-context-intelligence
          - tool-context-intelligence-query
          - tool-context-intelligence-upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: modules/${{ matrix.module }}
        # --frozen: respect the module's own lockfile exactly as committed.
        # The module declares the shared bundle as a @main git ref (NOT a path
        # source), so uv installs the *published* context_intelligence. The Run
        # tests step shadows it with the in-repo source (below).
        run: uv sync --frozen

      - name: Run tests
        working-directory: modules/${{ matrix.module }}
        # Test the module against the IN-REPO shared library, which may carry
        # not-yet-published changes (e.g. context_intelligence/tool_resolver.py)
        # that @main only gains when this PR merges. Put the checked-out root on
        # PYTHONPATH to shadow the @main-installed copy — the same convention
        # AGENTS.md prescribes for local runs.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest tests/ -q --tb=short --ignore=tests/dtu

# context-intelligence-mode-activation-validation.yaml
#
# RUNNABLE amplifier-digital-twin profile. Proves the explicit /context-intelligence
# ACTIVATION entry point mounts the full mode-gated surface and that /mode off removes
# it -- by loading the branch bundle THROUGH THE AMPLIFIER CLI from a Gitea mirror.
# NOT pytest/artefacts.
#
# HOW TO RUN:
#   export GH_TOKEN=$(gh auth token)
#   amplifier-digital-twin launch \
#     .amplifier/digital-twin-universe/profiles/context-intelligence-mode-activation-validation.yaml \
#     --name ci-mode-activation \
#     --var gitea_host=http://localhost:10110
#
# `readiness` RUNS ON LAUNCH (structural proof). `validation_cmds` documents the full
# suite; run each via `amplifier-digital-twin exec <id> -- <command>` (behavioural steps
# need an interactive TTY -- see notes).
#
# FOCUS: explicit activation mounts the WHOLE gated surface, off->on->off round-trip.
#   STRUCTURAL (deterministic):
#     * baseline agents present throughout; specialists absent when inactive
#       (`amplifier bundle show context-intelligence-behavior` => agents:(2) baseline).
#     * the installed mirror mode file declares advertised:false + the FULL gated surface:
#       2 contributes.agents, 3 contributes.context (incl. context-intelligence-strategy.md),
#       3 contributes.skills (incl. context-intelligence-evaluation-methodology), tool policies.
#   BEHAVIOURAL (real session, real key, interactive TTY):
#     * `/mode context-intelligence` activates (prompt -> [context-intelligence]>);
#       `/mode off` deactivates (`Mode off: context-intelligence` -> `>`). Full round-trip.
#     * LLM self-activation is DENIED (safety gate).
#   NOT CLI-INTROSPECTABLE IN THIS VERSION (reported honestly):
#     * the exact runtime-mounted set on activation (and the mode:transition_completed
#       data.mounted payload) is not dumpable via any CLI command; the logging hook's
#       additional_events covers delegate:* only. The full gated surface is therefore
#       proven by declared-contributes (installed mirror mode file) + inactive-baseline
#       gating + the activation/deactivation round-trip -- not by a mount enumeration.

name: context-intelligence-mode-activation-validation
description: >
  Runnable proof that explicit /context-intelligence activation mounts the full mode-gated
  surface and /mode off removes it. Loads the branch bundle via the Amplifier CLI from a
  Gitea mirror; proves inactive-baseline gating + full declared gated surface (structurally
  on launch) and the user-driven activation/deactivation round-trip (behaviourally).

base:
  image: ubuntu:24.04

passthrough:
  allow_external: true
  services:
    - name: anthropic
      key_env: ANTHROPIC_API_KEY
    - name: github
      key_env: GH_TOKEN

provision:
  setup_cmds:
    - apt-get update && apt-get install -y git curl python3 python3-venv jq

    - curl -LsSf https://astral.sh/uv/install.sh | sh

    - |
      if [ -n "${GH_TOKEN:-}" ]; then
        echo "machine github.com login x-token-auth password $GH_TOKEN" > /root/.netrc
        chmod 600 /root/.netrc
        git config --global credential.helper 'store'
      fi

    - |
      git config --global \
        url."${gitea_host}/microsoft/amplifier-bundle-context-intelligence".insteadOf \
        "https://github.com/microsoft/amplifier-bundle-context-intelligence"
      echo "insteadOf:"; git config --global --get-regexp insteadOf

    - uv tool install git+https://github.com/microsoft/amplifier@main

    - |
      mkdir -p /root/.amplifier
      cat > /root/.amplifier/settings.yaml << 'EOF'
      config:
        providers:
          - module: provider-anthropic
            source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@main
            config:
              api_key_env: ANTHROPIC_API_KEY
      EOF

    - |
      amplifier bundle add \
        git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=behaviors/context-intelligence.yaml \
        --app

    - amplifier --version

    - |
      echo 'export PATH="/root/.local/bin:$PATH"' >> /root/.bashrc
      echo 'PATH=/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' >> /etc/environment

readiness:
  - name: amplifier-usable
    command: "amplifier --version"

  - name: bundle-loaded-from-mirror
    command: >
      C=$(find /root/.amplifier/cache -maxdepth 1 -type d -name 'amplifier-bundle-context-intelligence-*' | head -1);
      git -C "$C" remote -v | grep -q "${gitea_host}/microsoft/amplifier-bundle-context-intelligence"
      && git -C "$C" log -1 --pretty=%s | grep -qi "docs/contributing-and-pr-template"
      && echo "ready: bundle resolved from mirror @ branch snapshot"

  - name: baseline-present-specialists-gated
    command: >
      OUT=$(amplifier bundle show context-intelligence-behavior 2>/dev/null);
      echo "$OUT" | grep -q "context-intelligence:graph-analyst"
      && echo "$OUT" | grep -q "context-intelligence:session-navigator"
      && ! echo "$OUT" | grep -q "context-intelligence-design-facilitator"
      && ! echo "$OUT" | grep -q "context-intelligence-tool-designer"
      && echo "ready: baseline present, specialists gated when inactive"

  - name: full-gated-surface-declared-in-mirror-modefile
    # The strategy context + evaluation-methodology skill (the coverage this profile owns)
    # must be declared in the installed mode file from the mirror.
    command: >
      C=$(find /root/.amplifier/cache -maxdepth 1 -type d -name 'amplifier-bundle-context-intelligence-*' | head -1);
      M="$C/modes/context-intelligence.md";
      grep -q "context-intelligence-strategy.md" "$M"
      && grep -q "context-intelligence-evaluation-methodology" "$M"
      && grep -q "context-intelligence-design-facilitator" "$M"
      && grep -q "context-intelligence-tool-designer" "$M"
      && echo "ready: full gated surface (3 context + 3 skills + 2 agents) declared"

validation_cmds:
  # ---- STRUCTURAL ----
  - name: S1-inactive-baseline
    command: |
      echo "== bundle show: expect agents:(2) baseline, no specialists =="
      amplifier bundle show context-intelligence-behavior

  - name: S2-full-gated-surface-declared
    command: |
      C=$(find /root/.amplifier/cache -maxdepth 1 -type d -name 'amplifier-bundle-context-intelligence-*' | head -1)
      echo "== mode.contributes (agents/context/skills) from installed mirror mode file =="
      sed -n '/contributes:/,/tools:/p' "$C/modes/context-intelligence.md"
      echo "== tool policies =="
      sed -n '/tools:/,/^---/p' "$C/modes/context-intelligence.md"

  # ---- BEHAVIOURAL (interactive; needs real key + TTY) ----
  # S1-scenario (explicit slash-command activation) -- drive interactively:
  #   amplifier-digital-twin exec --visual-id ci <id>
  #   $ cd /root/ci-int && amplifier run --mode chat
  #   > /mode context-intelligence          => "Mode: context-intelligence ..." ; prompt -> [context-intelligence]>
  #   [context-intelligence]> /mode off      => "Mode off: context-intelligence"  ; prompt -> >
  - name: B1-explicit-activation-roundtrip
    command: |
      echo "Interactive (real TTY). Off->On->Off round-trip expected transcript:"
      echo "  > /mode context-intelligence      => Mode: context-intelligence ... ; prompt -> [context-intelligence]>"
      echo "  [context-intelligence]> /mode off => Mode off: context-intelligence ; prompt -> >"

  - name: B2-self-activation-denied
    command: |
      mkdir -p /root/ci-deny && cd /root/ci-deny
      amplifier run "Call the mode tool with operation=set and name=context-intelligence." \
        --output-format json-trace 2>/dev/null | jq -r '.execution_trace[]?|select(.tool=="mode")|.result.output.status'
      echo "^ expect: denied"

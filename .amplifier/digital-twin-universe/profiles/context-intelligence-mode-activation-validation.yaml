# Context-intelligence mode ACTIVATION — DTU validation profile.
#
# PURPOSE
#   Prove the explicit `/context-intelligence` activation entry point mounts the
#   FULL mode-gated surface and that `/mode off` removes it cleanly:
#     - all mode-gated AGENTS resolve  (the two contributes.agents specialists)
#     - all mode-gated CONTEXT is injected (all THREE contributes.context files)
#     - all mode-gated SKILLS become discoverable (all THREE contributes.skills)
#     - the mode tool policies take effect
#   Baseline agents (graph-analyst, session-navigator) stay present throughout —
#   they are registered at the behavior level, NOT gated by the mode.
#
#   This complements the two existing mode profiles:
#     - context-intelligence-redesigned-mode-validation.yaml  → the 5-phase workflow end-to-end
#     - context-intelligence-contributes-migration-validation.yaml → the contributes.agents gating migration
#   Neither of those asserts the THIRD context file (context-intelligence-strategy.md)
#   or the THIRD skill (context-intelligence-evaluation-methodology). This profile does —
#   it is the single-purpose "explicit activation mounts the whole gated surface" test.
#
# ACTIVATION MECHANISM
#   The mode's user-facing entry point is the explicit slash command `/context-intelligence`
#   (mode name = context-intelligence; advertised: false, so it is hidden from `mode list`
#   but activatable by name). Structural assertions below use the harness `when: { mode: ... }`
#   key — the harness's realization of that activation — and the behavioral scenario drives
#   activation the way a user does, by sending `/context-intelligence` as the message.
#
# USAGE
#   amplifier-digital-twin launch \
#     .amplifier/digital-twin-universe/profiles/context-intelligence-mode-activation-validation.yaml \
#     --name context-intelligence-mode-activation-validation \
#     --var gitea_host=http://your-gitea:3000

profile:
  name: context-intelligence-mode-activation-validation
  version: 1.0.0
  description: >
    Proves explicit /context-intelligence activation mounts ALL mode-gated agents,
    context files, and skills — and that /mode off removes them cleanly. Baseline
    agents remain present throughout. Closes the strategy-context and
    evaluation-methodology-skill coverage holes left by the other two mode profiles.

# Gitea url_rewrites enable local-branch testing: point {gitea_host} at a Gitea
# instance with your branch mirrored. Two forms are rewritten:
#   1. the bare @main URL (bundle root, used by `amplifier bundle add`)
#   2. the #subdirectory=skills variant (skill companion loading)
url_rewrites:
  - from: "git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main"
    to:   "git+http://{gitea_host}/microsoft/amplifier-bundle-context-intelligence@main"
  - from: "git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=skills"
    to:   "git+http://{gitea_host}/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=skills"

install:
  # Behaviour-only install: add just the context-intelligence behavior (mode,
  # agents, tool policies, contributes.*) to the app-level Amplifier config.
  command: "amplifier bundle add git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=behaviors/context-intelligence.yaml --app"

assertions:
  - id: A1-baseline-mode-inactive
    description: >
      BEFORE activation (mode inactive): the two mode-gated specialists are NOT
      registered, the mode-gated context is NOT injected, and the design skills are
      NOT discoverable. Baseline agents ARE present. The mode is hidden from listings
      (advertised: false).
    when:
      mode: inactive
    expect:
      agents_present:
        - context-intelligence:graph-analyst
        - context-intelligence:session-navigator
      agents_absent:
        - context-intelligence:context-intelligence-design-facilitator
        - context-intelligence:context-intelligence-tool-designer
      context_file_not_present:
        - "context-intelligence:context/jsonl-event-schema.md"
        - "context-intelligence:context/dual-path-library-template.md"
        - "context-intelligence:context/context-intelligence-strategy.md"
      skills_absent:
        - context-intelligence-tool-design
        - context-intelligence-eval-design
        - context-intelligence-evaluation-methodology
      mode_not_listed: context-intelligence

  - id: A2-explicit-activation-mounts-full-gated-surface
    description: >
      AFTER explicit /context-intelligence activation: BOTH specialists resolve,
      ALL THREE mode-gated context files are injected, ALL THREE mode-gated skills
      are discoverable, and the mode tool policies are in force. Baseline agents
      remain present.
    when:
      mode: active
    expect:
      agents_present:
        - context-intelligence:graph-analyst
        - context-intelligence:session-navigator
      agents_available:
        - context-intelligence:context-intelligence-design-facilitator
        - context-intelligence:context-intelligence-tool-designer
      context_files_injected:
        - "context-intelligence:context/jsonl-event-schema.md"
        - "context-intelligence:context/dual-path-library-template.md"
        - "context-intelligence:context/context-intelligence-strategy.md"
      skills_present:
        - context-intelligence-tool-design
        - context-intelligence-eval-design
        - context-intelligence-evaluation-methodology
      tool_policies:
        safe: [graph_query, blob_read, read_file, glob, grep, delegate, load_skill, todo]
        warn: [bash, write_file, edit_file]

  - id: A3-mode-off-clean-unmount
    description: >
      AFTER /mode off (mode was active, then deactivated): the specialists, the
      mode-gated context, and the design skills are all gone. Baseline agents and the
      general (always-on) skills remain.
    when:
      mode: inactive
      after: activation
    expect:
      agents_absent:
        - context-intelligence:context-intelligence-design-facilitator
        - context-intelligence:context-intelligence-tool-designer
      agents_present:
        - context-intelligence:graph-analyst
        - context-intelligence:session-navigator
      context_file_not_present:
        - "context-intelligence:context/jsonl-event-schema.md"
        - "context-intelligence:context/dual-path-library-template.md"
        - "context-intelligence:context/context-intelligence-strategy.md"
      skills_absent:
        - context-intelligence-tool-design
        - context-intelligence-eval-design
        - context-intelligence-evaluation-methodology
      general_skills_present:
        - blob-reading
        - context-intelligence-graph-query
        - context-intelligence-session-navigation

scenarios:
  - id: S1-explicit-slash-command-activates-mode
    description: >
      Drive activation the way a USER does — send the explicit `/context-intelligence`
      slash command — and confirm the mode actually turns on (transition event) and the
      gated specialists become invokable. This proves the real user entry point, not just
      the harness's internal mode toggle.
    setup:
      mode: inactive
    user_message: "/context-intelligence"
    pass_criteria:
      mode_active: context-intelligence
      jsonl_event:
        type: "mode:transition_completed"
        payload_path: "data.mounted"
        payload_contains:
          - "context-intelligence:context/jsonl-event-schema.md"
          - "context-intelligence:context/dual-path-library-template.md"
          - "context-intelligence:context/context-intelligence-strategy.md"
      agents_available:
        - context-intelligence:context-intelligence-design-facilitator
        - context-intelligence:context-intelligence-tool-designer

# context-intelligence-write-server-validation.yaml
#
# RUNNABLE amplifier-digital-twin profile (base + provision + readiness).
# Proves the WRITE-TO-A-SINGLE-SERVER seam: the context-intelligence logging hook,
# loaded via the Amplifier CLI from a Gitea mirror of the branch under test, POSTs
# session events to ONE real Context-Intelligence server. NOT pytest/artefacts.
#
# CONFIG PATH = THE DOCUMENTED USER PATH (README "Getting started" + "Server forwarding")
#   The hook's `destinations` is a NAMED MAP under
#     overrides.hook-context-intelligence.config.destinations   in ~/.amplifier/settings.yaml
#   with each destination's api_key referenced as ${VAR} from ~/.amplifier/keys.env
#   (loaded automatically by the app-cli at startup; ${VAR} expanded before it reaches the
#   hook). This is the real user path -- NOT the deprecated single-server env scalars, and
#   NOT any direct patch of the bundle's loaded hook-config YAML.
#
#   (Historical note: an earlier version of this profile wrote a PROJECT-scope
#   `.amplifier/settings.yaml` and, when that was a no-op, patched the cached bundle YAML.
#   The project-scope overlay is the amplifier-foundation configurator overlay that is
#   "reserved for v1.1" -- the WRONG path. The USER-level ~/.amplifier/settings.yaml
#   `overrides.<module>.config` path is applied by the app-cli's get_config_overrides()
#   to providers/tools/hooks alike, and IS implemented. This profile uses only that.)
#
# TOPOLOGY
#   host: a real Context-Intelligence server (Neo4j + API) stood up via docker compose,
#         reachable from the DTU at the Incus host-gateway IP (e.g. http://10.67.103.1:18001).
#   DTU:  amplifier + the branch bundle (full context-intelligence behavior = design + logging).
#
# HOW TO RUN
#   # 1. stand up the server on the host (server repo microsoft/amplifier-context-intelligence
#   #    docker-compose.yml -> start.sh generates credentials.yaml + prints the API token once).
#   #    Bind it to the Incus gateway IP so the container can reach it, and confirm:
#   #      curl -sf http://10.67.103.1:18001/status
#   export GH_TOKEN=$(gh auth token)
#   amplifier-digital-twin launch \
#     .amplifier/digital-twin-universe/profiles/context-intelligence-write-server-validation.yaml \
#     --name ci-write-single \
#     --var gitea_host=http://localhost:10110 \
#     --var server_url=http://10.67.103.1:18001 \
#     --var server_token=<RAW_API_TOKEN> \
#     --var workspace=ci-write-single
#
# WHAT IS PROVEN
#   STRUCTURAL (deterministic; readiness gates, run on launch, no LLM):
#     * bundle installed via `amplifier bundle add ... --app` resolved to the MIRROR.
#     * ~/.amplifier/settings.yaml declares the named 'main' destination with api_key as a
#       ${VAR} reference (never a literal), and ~/.amplifier/keys.env supplies that var.
#     * the server is reachable from the DTU and reports neo4j_connected:true.
#   BEHAVIOURAL (real session, real Anthropic key; the exec step below):
#     * a real `amplifier run` session emits events; the hook (configured ONLY via the
#       documented settings.yaml + keys.env) POSTs them to the server; the server's /status
#       lists the session under this workspace with events_processed>0, AND a Cypher query
#       (/cypher) returns >=1 node tagged workspace=<workspace>.
#
# NOTE ON write-to-FILE: local-JSONL capture is already covered by
# context-intelligence-bundle-smoke-test.yaml -- not duplicated here.

name: context-intelligence-write-server-validation
description: >
  Runnable proof of the write-to-a-single-server seam via the DOCUMENTED config path
  (named-map destinations in ~/.amplifier/settings.yaml + ${VAR} api_key from
  ~/.amplifier/keys.env). Loads the branch bundle via the Amplifier CLI from a Gitea mirror,
  runs a real session, and proves the server received the events (workspace-tagged) via
  /status and a Cypher query.

base:
  image: ubuntu:24.04

passthrough:
  allow_external: true
  services:
    - name: anthropic
      key_env: ANTHROPIC_API_KEY
    - name: github
      key_env: GH_TOKEN

provision:
  setup_cmds:
    - apt-get update && apt-get install -y git curl python3 python3-venv python3-yaml jq

    - curl -LsSf https://astral.sh/uv/install.sh | sh

    - |
      if [ -n "${GH_TOKEN:-}" ]; then
        echo "machine github.com login x-token-auth password $GH_TOKEN" > /root/.netrc
        chmod 600 /root/.netrc
        git config --global credential.helper 'store'
      fi

    # Narrow rewrite: only the context-intelligence bundle self-references -> mirror.
    - |
      git config --global \
        url."${gitea_host}/microsoft/amplifier-bundle-context-intelligence".insteadOf \
        "https://github.com/microsoft/amplifier-bundle-context-intelligence"
      echo "insteadOf:"; git config --global --get-regexp insteadOf

    - uv tool install git+https://github.com/microsoft/amplifier@main

    # ---- keys.env: SECRETS ONLY (never committed). The bearer token, named MAIN_CI_KEY.
    # DTU substitutes ${server_token} (a --var) to the literal token BEFORE the container
    # shell runs; the quoted heredoc leaves it untouched thereafter.
    - |
      mkdir -p /root/.amplifier
      cat > /root/.amplifier/keys.env << 'KEYSEOF'
      MAIN_CI_KEY=${server_token}
      KEYSEOF
      chmod 600 /root/.amplifier/keys.env

    # ---- settings.yaml: the DOCUMENTED config. Provider + the NAMED-MAP destination.
    # api_key is the ${VAR} REFERENCE (literal text, NOT the secret) -- MAIN_CI_KEY is not a
    # DTU --var, so DTU leaves ${MAIN_CI_KEY} intact; the quoted heredoc keeps the shell from
    # expanding it; the app-cli expands it from keys.env before it reaches the hook.
    # ${server_url}/${workspace} ARE --vars, so DTU substitutes them to literals here.
    - |
      cat > /root/.amplifier/settings.yaml << 'SETTINGSEOF'
      config:
        providers:
          - module: provider-anthropic
            source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@main
            config:
              api_key_env: ANTHROPIC_API_KEY
      overrides:
        hook-context-intelligence:
          config:
            workspace: "${workspace}"
            destinations:
              main:
                url: "${server_url}"
                api_key: "${MAIN_CI_KEY}"
                include: ["**"]
      SETTINGSEOF
      echo "== settings.yaml written =="; cat /root/.amplifier/settings.yaml

    # Load the branch bundle THROUGH THE CLI (redirected to the mirror). FULL behavior
    # => design (read/query tools) + logging hook (write). bundle add --app merges its
    # registry entry into the settings.yaml written above (preserving config + overrides).
    - |
      amplifier bundle add \
        git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=behaviors/context-intelligence.yaml \
        --app

    # ---- verification-only endpoint file (NOT hook config): lets the readiness/manual steps
    # curl the server. The hook is configured EXCLUSIVELY by settings.yaml + keys.env above.
    - |
      cat > /root/ci-verify.env << 'VERIFYEOF'
      SERVER_URL=${server_url}
      SERVER_TOKEN=${server_token}
      WORKSPACE=${workspace}
      VERIFYEOF
      echo 'export PATH="/root/.local/bin:$PATH"' >> /root/.bashrc
      echo 'PATH=/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' >> /etc/environment

    - amplifier --version

readiness:
  - name: amplifier-usable
    command: "amplifier --version"

  - name: bundle-loaded-from-mirror
    command: >
      C=$(find /root/.amplifier/cache -maxdepth 1 -type d -name 'amplifier-bundle-context-intelligence-*' | head -1);
      git -C "$C" remote -v | grep -q "${gitea_host}/microsoft/amplifier-bundle-context-intelligence"
      && git -C "$C" log -1 --pretty=%s | grep -qi "docs/contributing-and-pr-template"
      && echo "ready: bundle resolved from mirror @ branch snapshot"

  - name: logging-hook-present
    command: >
      amplifier bundle show context-intelligence-behavior 2>/dev/null
      | grep -q "hook-context-intelligence"
      && echo "ready: logging hook loaded via CLI"

  - name: destination-configured-in-user-settings
    # Deterministic proof of the DOCUMENTED config: ~/.amplifier/settings.yaml declares a
    # single named destination 'main' whose api_key is a ${VAR} reference (NOT a literal),
    # and ~/.amplifier/keys.env supplies that referenced var. No LLM.
    # NOTE: literal block scalar (|) -- a folded scalar (>) would collapse the heredoc newlines.
    command: |
      python3 - <<'PY'
      import re, yaml, sys
      s = yaml.safe_load(open('/root/.amplifier/settings.yaml'))
      dest = s['overrides']['hook-context-intelligence']['config']['destinations']
      assert set(dest) == {'main'}, dest
      api = dest['main']['api_key']
      m = re.fullmatch(r'\$\{([A-Za-z_][A-Za-z0-9_]*)\}', api.strip())
      assert m, f'api_key must be a ${{VAR}} reference, got literal: {api!r}'
      var = m.group(1)
      env = open('/root/.amplifier/keys.env').read()
      assert re.search(rf'(?m)^{var}=', env), f'{var} missing from keys.env'
      assert dest['main']['include'] == ['**']
      print(f'ready: destination main -> api_key ${{{var}}} (referenced, not literal); keys.env supplies {var}')
      PY

  - name: server-reachable-from-dtu
    command: >
      . /root/ci-verify.env;
      curl -sf "$SERVER_URL/status"
      | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['status']=='ok' and d['neo4j_connected'];print('ready: server reachable, neo4j_connected')"

manual_validation_steps:
  # ---- BEHAVIOURAL: run a real session (hook configured ONLY via settings.yaml + keys.env),
  # then prove the server received the events. Run via:
  #   amplifier-digital-twin exec <id> -- bash -lc 'bash /root/run_write.sh'
  - name: B1-emit-and-prove-received
    command: |
      # No AMPLIFIER_CONTEXT_INTELLIGENCE_* env exports -- the hook is driven purely by the
      # documented ~/.amplifier/settings.yaml + keys.env. ci-verify.env is only for the curls.
      . /root/ci-verify.env
      mkdir -p /root/ci-write && cd /root/ci-write
      echo "== emit events through a real session =="
      amplifier run "Say hello in exactly one word." --output-format json > /root/write-run.json 2>/root/write-run.err || cat /root/write-run.err
      sleep 3
      echo "== server /status: sessions under workspace=$WORKSPACE =="
      curl -sf "$SERVER_URL/status" \
        | jq '{active_sessions, sessions: [.sessions[]|{session_id, workspace, events_processed}], completed: [.completed_sessions[]?|{session_id, workspace, events_processed}]}'
      echo "== Cypher: count nodes tagged with this workspace =="
      # NOTE: this server's /cypher does NOT accept a `parameters` map -> inline the literal
      # workspace (safe; we control it). Use WHERE n.workspace = "<ws>".
      curl -sf -X POST "$SERVER_URL/cypher" \
        -H "Authorization: Bearer $SERVER_TOKEN" \
        -H 'Content-Type: application/json' \
        -d "{\"query\":\"MATCH (n) WHERE n.workspace = \\\"$WORKSPACE\\\" RETURN count(n) AS n\"}" \
        | jq .
      echo "^ PASS iff a session with this workspace has events_processed>0 AND node count >= 1"

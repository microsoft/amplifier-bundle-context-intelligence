# Smoke-test profile for amplifier-bundle-context-intelligence
#
# Tests: library imports, CLI tools, hook ConfigResolver, and Amplifier
# bundle loading.  Does NOT require an external CI server.
#
# Usage:
#   export GH_TOKEN=$(gh auth token)
#   amplifier-digital-twin launch .amplifier/digital-twin-universe/profiles/ci-bundle-smoke-test.yaml \
#     --name ci-bundle-smoke-test
name: ci-bundle-smoke-test
description: >
  Smoke test for the context-intelligence bundle.  Validates library imports,
  upload CLI, hook additional_events config, and Amplifier bundle loading.

base:
  image: ubuntu:24.04

passthrough:
  allow_external: true
  services:
    - name: anthropic
      key_env: ANTHROPIC_API_KEY
    - name: github
      key_env: GH_TOKEN

provision:
  setup_cmds:
    # System dependencies
    - apt-get update && apt-get install -y git curl python3 python3-venv

    # Install uv
    - curl -LsSf https://astral.sh/uv/install.sh | sh

    # Configure git credentials for private GitHub repos
    - |
      if [ -n "$GH_TOKEN" ]; then
        echo "machine github.com login x-token-auth password $GH_TOKEN" > /root/.netrc
        chmod 600 /root/.netrc
        git config --global credential.helper 'store'
      fi

    # Clone the bundle (HEAD of main, commit 84c7d53)
    - |
      export PATH="/root/.local/bin:$PATH"
      git clone --depth 1 https://github.com/microsoft/amplifier-bundle-context-intelligence.git /opt/ci-bundle

    # Create a venv and install packages in dependency order.
    # Ubuntu 24.04 marks system Python as externally managed (PEP 668),
    # so we use a dedicated virtualenv for the smoke-test packages.
    - |
      export PATH="/root/.local/bin:$PATH"
      uv venv /opt/venv --python python3
      export VIRTUAL_ENV=/opt/venv
      export PATH="/opt/venv/bin:$PATH"
      uv pip install /opt/ci-bundle/
      uv pip install "httpx>=0.28.1"
      uv pip install --no-deps /opt/ci-bundle/modules/hook-context-intelligence/
      uv pip install --no-deps /opt/ci-bundle/modules/tool-context-intelligence-upload/

    # Quick sanity — library importable?
    - /opt/venv/bin/python3 -c "from context_intelligence.config import resolve_config; print('context_intelligence importable')"

    # Install Amplifier itself (uv tool uses its own isolated venv)
    - |
      export PATH="/root/.local/bin:$PATH"
      uv tool install git+https://github.com/microsoft/amplifier@main

    # Configure Amplifier provider
    - |
      mkdir -p /root/.amplifier
      cat > /root/.amplifier/settings.yaml << 'EOF'
      config:
        providers:
          - module: provider-anthropic
            source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@main
            config:
              api_key_env: ANTHROPIC_API_KEY
      EOF

    # Add the context-intelligence bundle to Amplifier
    - |
      export PATH="/root/.local/bin:$PATH"
      amplifier bundle add git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main --app

    # Verify Amplifier is working
    - |
      export PATH="/root/.local/bin:$PATH"
      amplifier --version

    # Persist PATH for interactive shells and exec commands
    - |
      echo 'export PATH="/opt/venv/bin:/root/.local/bin:$PATH"' >> /root/.bashrc
      echo 'export VIRTUAL_ENV=/opt/venv' >> /root/.bashrc
      echo 'PATH=/opt/venv/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' >> /etc/environment
      echo 'VIRTUAL_ENV=/opt/venv' >> /etc/environment

    # Workspace for the user
    - mkdir -p /home/user/project

readiness:
  - name: library-check
    command: "/opt/venv/bin/python3 -c \"from context_intelligence.client import AsyncCIClient; print('ready')\""

# context-intelligence-redesigned-mode-validation.yaml
#
# RUNNABLE amplifier-digital-twin profile (base + provision + readiness).
# Proves the redesigned /context-intelligence mode by loading the branch bundle
# THROUGH THE AMPLIFIER CLI from a Gitea mirror -- NOT by running pytest/artefacts.
#
# HOW TO RUN (mirror must be reachable; localhost is auto-rewritten to the Incus
# host-gateway IP so the container can reach a host-side Gitea):
#   export GH_TOKEN=$(gh auth token)
#   amplifier-digital-twin launch \
#     .amplifier/digital-twin-universe/profiles/context-intelligence-redesigned-mode-validation.yaml \
#     --name ci-redesigned-mode \
#     --var gitea_host=http://localhost:10110
#
# The `readiness` checks below RUN ON LAUNCH and gate the environment: they prove
# (deterministically, no LLM) that the bundle loaded from the mirror and that the
# mode-gating surface is correct when the mode is INACTIVE. The `validation_cmds`
# block documents the full structural + behavioural check-suite; run each step via
#   amplifier-digital-twin exec <id> -- <command>
# (`validation_cmds` is not auto-executed by launch -- it is the documented,
# reproducible evidence procedure, incl. the interactive-TTY behavioural steps).
#
# WHAT IS PROVABLE VIA THE CLI (discovered empirically -- see notes per step):
#   STRUCTURAL (deterministic, no LLM):
#     * bundle installed via `amplifier bundle add ... --app` resolved to the MIRROR
#       (cache checkout HEAD == the branch snapshot commit; origin == mirror URL).
#     * `amplifier bundle show context-intelligence-behavior` reports exactly the
#       2 BASELINE agents (graph-analyst, session-navigator) and NOT the 2 mode-gated
#       specialists -> proves the specialists are gated OFF when the mode is inactive.
#     * the installed mode file declares advertised:false, default_action:block, and
#       the 3 contributes.context / 3 contributes.skills / 2 contributes.agents.
#   BEHAVIOURAL (real session, real Anthropic key):
#     * in an interactive TTY chat, the USER slash command `/mode context-intelligence`
#       activates the mode (prompt -> `[context-intelligence]>`); `/mode off` deactivates
#       (`Mode off: context-intelligence` -> `>`). Full off->on->off round-trip.
#     * agent/LLM SELF-activation of the mode is DENIED by design (the mode tool returns
#       status:denied, requiring explicit user confirmation) -- the safety gate works.
#   NOT CLI-INTROSPECTABLE IN THIS VERSION (reported honestly, not faked):
#     * the exact per-activation MOUNTED set (which specific agents/context/skills the
#       mode manager mounts while active) is not dumpable via any CLI command, and the
#       logging hook's additional_events does NOT include mode:transition_completed, so
#       events.jsonl cannot be used to enumerate the mount. The gated surface is proven
#       by (a) the declared contributes in the installed mirror mode file and (b) the
#       inactive-baseline gating from `bundle show`, plus the activation round-trip.

name: context-intelligence-redesigned-mode-validation
description: >
  Runnable end-to-end validation of the redesigned /context-intelligence mode.
  Loads the branch bundle through the Amplifier CLI from a Gitea mirror and proves
  (structurally, on launch) mirror provenance + inactive-mode gating, and
  (behaviourally, via an interactive TTY session) the user-driven mode
  activation/deactivation round-trip.

base:
  image: ubuntu:24.04

passthrough:
  allow_external: true
  services:
    - name: anthropic
      key_env: ANTHROPIC_API_KEY
    - name: github
      key_env: GH_TOKEN

provision:
  setup_cmds:
    - apt-get update && apt-get install -y git curl python3 python3-venv jq

    - curl -LsSf https://astral.sh/uv/install.sh | sh

    # GitHub creds for amplifier core / provider / modes (fetched from real GitHub)
    - |
      if [ -n "${GH_TOKEN:-}" ]; then
        echo "machine github.com login x-token-auth password $GH_TOKEN" > /root/.netrc
        chmod 600 /root/.netrc
        git config --global credential.helper 'store'
      fi

    # NARROW git rewrite: redirect ONLY the context-intelligence bundle's own
    # self-references (the top-level add AND every transitive #subdirectory=skills /
    # modules reference inside the bundle) to the Gitea mirror of the branch.
    # amplifier core, provider-anthropic, amplifier-bundle-modes still use real GitHub.
    - |
      git config --global \
        url."${gitea_host}/microsoft/amplifier-bundle-context-intelligence".insteadOf \
        "https://github.com/microsoft/amplifier-bundle-context-intelligence"
      echo "insteadOf:"; git config --global --get-regexp insteadOf

    - uv tool install git+https://github.com/microsoft/amplifier@main

    - |
      mkdir -p /root/.amplifier
      cat > /root/.amplifier/settings.yaml << 'EOF'
      config:
        providers:
          - module: provider-anthropic
            source: git+https://github.com/microsoft/amplifier-module-provider-anthropic@main
            config:
              api_key_env: ANTHROPIC_API_KEY
      EOF

    # Load the branch bundle THROUGH THE CLI. The github URL is transparently
    # redirected to the mirror by the insteadOf rule -> installs the branch snapshot.
    # FULL behavior => design (mode + specialists + skills + context) + logging hook.
    - |
      amplifier bundle add \
        git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=behaviors/context-intelligence.yaml \
        --app

    - amplifier --version

    - |
      echo 'export PATH="/root/.local/bin:$PATH"' >> /root/.bashrc
      echo 'PATH=/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin' >> /etc/environment

readiness:
  # These RUN ON LAUNCH and gate readiness -- the structural proof, no LLM needed.
  - name: amplifier-usable
    command: "amplifier --version"

  - name: bundle-loaded-from-mirror
    # cache checkout origin must be the mirror AND HEAD must be the branch snapshot
    command: >
      C=$(find /root/.amplifier/cache -maxdepth 1 -type d -name 'amplifier-bundle-context-intelligence-*' | head -1);
      git -C "$C" remote -v | grep -q "${gitea_host}/microsoft/amplifier-bundle-context-intelligence"
      && git -C "$C" log -1 --pretty=%s | grep -qi "docs/contributing-and-pr-template"
      && echo "ready: bundle resolved from mirror @ branch snapshot"

  - name: baseline-agents-present-and-specialists-gated
    # `bundle show` must list the 2 baseline agents and NOT the 2 mode-gated specialists.
    command: >
      OUT=$(amplifier bundle show context-intelligence-behavior 2>/dev/null);
      echo "$OUT" | grep -q "context-intelligence:graph-analyst"
      && echo "$OUT" | grep -q "context-intelligence:session-navigator"
      && ! echo "$OUT" | grep -q "context-intelligence-design-facilitator"
      && ! echo "$OUT" | grep -q "context-intelligence-tool-designer"
      && echo "ready: baseline agents present, specialists gated when mode inactive"

validation_cmds:
  # ---- STRUCTURAL (deterministic; run via `amplifier-digital-twin exec <id> -- ...`) ----
  - name: S1-mirror-provenance
    command: |
      C=$(find /root/.amplifier/cache -maxdepth 1 -type d -name 'amplifier-bundle-context-intelligence-*' | head -1)
      echo "== origin ==";  git -C "$C" remote -v
      echo "== HEAD ==";    git -C "$C" log -1 --oneline
      echo "== branch-unique markers =="; ls "$C/CONTRIBUTING.md" "$C/.amplifier/digital-twin-universe/profiles/" 2>/dev/null

  - name: S2-inactive-gating-and-tools
    command: |
      echo "== bundle show (mode inactive) -- expect agents:(2) baseline only =="
      amplifier bundle show context-intelligence-behavior

  - name: S3-mode-file-contract
    command: |
      C=$(find /root/.amplifier/cache -maxdepth 1 -type d -name 'amplifier-bundle-context-intelligence-*' | head -1)
      echo "== installed mode file: advertised/default_action + contributes =="
      sed -n '1,30p' "$C/modes/context-intelligence.md"

  # ---- BEHAVIOURAL (real session; needs a valid ANTHROPIC_API_KEY + interactive TTY) ----
  # NOTE: mode activation is a USER slash command handled by the REPL only under a real
  # TTY. Piped/single-shot `amplifier run` sends it to the LLM, whose mode-set is DENIED
  # (safety gate). Drive it interactively:
  #   amplifier-digital-twin exec --visual-id ci <id>        # real TTY shell
  #   $ cd /root/ci-int && amplifier run --mode chat
  #   > /mode context-intelligence      # -> prompt becomes [context-intelligence]>
  #   [context-intelligence]> /mode off # -> "Mode off: context-intelligence" -> >
  - name: B1-user-activation-roundtrip
    command: |
      echo "Behavioural step -- run interactively (see NOTE above). Expected transcript:"
      echo "  > /mode context-intelligence   =>  Mode: context-intelligence ... ; prompt -> [context-intelligence]>"
      echo "  [context-intelligence]> /mode off  =>  Mode off: context-intelligence ; prompt -> >"

  - name: B2-self-activation-denied
    command: |
      mkdir -p /root/ci-deny && cd /root/ci-deny
      echo "LLM self-activation must be DENIED (safety gate):"
      amplifier run "Call the mode tool with operation=set and name=context-intelligence, then reply ACTIVATED." \
        --output-format json-trace 2>/dev/null | jq -r '.execution_trace[]?|select(.tool=="mode")|.result.output.status' 2>/dev/null
      echo "^ expect: denied"

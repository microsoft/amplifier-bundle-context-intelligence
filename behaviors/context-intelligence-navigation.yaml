bundle:
  name: context-intelligence-navigation-behavior
  version: 0.1.0
  description: >
    LAYER 1 of 3 (innermost). The single home for the three context-intelligence
    agents (graph-analyst, session-navigator, server-data-ops); the analysis
    behavior imports this one rather than listing them again. Imports nothing
    itself. session-navigator reads raw session JSONL on disk with no graph
    server; use for local/offline navigation plus graph analysis and session
    data operations.

agents:
  include:
    - context-intelligence:graph-analyst
    - context-intelligence:session-navigator
    - context-intelligence:server-data-ops

tools:
  - module: tool-delegate
    source: git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    config:
      skills:
        - "git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=skills/context-intelligence-session-navigation"

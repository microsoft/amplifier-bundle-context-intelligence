bundle:
  name: context-intelligence-behavior
  version: 0.1.0
  description: >
    Context intelligence capability: graph-powered session analysis
    and event-driven telemetry capture for Amplifier sessions.

agents:
  include:
    - context-intelligence:graph-analyst
    - context-intelligence:session-navigator
    # context-intelligence-design-facilitator and context-intelligence-tool-designer
    # removed — now contributed by the context-intelligence mode via contributes.agents

modes:
  include:
    - context-intelligence:modes/context-intelligence.md

tools:
  - module: tool-delegate
    source: git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/tool-delegate
  - module: tool-graph-query
    source: git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=modules/tool-graph-query
  - module: tool-blob-read
    source: git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=modules/tool-blob-read
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=modules/tool-skills
    config:
      skills:
        # General context-intelligence skills only — design-phase skills gated behind the context-intelligence mode
        - "git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=skills/blob-reading"
        - "git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=skills/context-intelligence-graph-query"
        - "git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=skills/context-intelligence-session-navigation"
        - "git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=skills/context-intelligence-session-reconstruction"
        - "git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=skills/workflow-pattern-analysis"

hooks:
  - module: hook-context-intelligence
    source: git+https://github.com/microsoft/amplifier-bundle-context-intelligence@main#subdirectory=modules/hook-context-intelligence
    config:
      context_intelligence_server_url: "${AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_URL:}"
      context_intelligence_api_key: "${AMPLIFIER_CONTEXT_INTELLIGENCE_API_KEY:}"
      # workspace: auto-resolved from coordinator project_slug → config → env var fallback
      workspace: "${AMPLIFIER_CONTEXT_INTELLIGENCE_WORKSPACE:}"
      log_level: "${AMPLIFIER_CONTEXT_INTELLIGENCE_LOG_LEVEL:INFO}"
      dispatch_timeout: "${AMPLIFIER_CONTEXT_INTELLIGENCE_DISPATCH_TIMEOUT:30}"
      dispatch_failure_threshold: "${AMPLIFIER_CONTEXT_INTELLIGENCE_DISPATCH_FAILURE_THRESHOLD:3}"
      additional_events:
        - delegate:agent_spawned
        - delegate:agent_resumed
        - delegate:agent_completed
        - delegate:agent_cancelled
        - delegate:error
      # base_path: ~/.amplifier/projects  (auto-resolved; uncomment to override)
      # project_slug: (auto-resolved from working directory; uncomment to override)
      # exclude_events: []  (optional fnmatch patterns; uncomment and list events to suppress)

context:
  include:
    - context-intelligence:context/context-intelligence-awareness.md

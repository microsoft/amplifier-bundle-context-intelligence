bundle:
  name: context-intelligence-behavior
  version: 0.1.0
  description: >
    Full context intelligence: graph-powered session analysis, navigation agents,
    skills, design mode, AND the event-capture hook for session telemetry.
    Composes the analytics behavior (read/query/design) and the logging behavior
    (event-capture hook) into a single drop-in. Use this when you want both
    read/query capabilities AND session instrumentation. For finer-grained control,
    compose context-intelligence-analytics (read only) or
    context-intelligence-logging (hook only) directly.

includes:
  - bundle: context-intelligence:behaviors/context-intelligence-analytics
  - bundle: context-intelligence:behaviors/context-intelligence-logging

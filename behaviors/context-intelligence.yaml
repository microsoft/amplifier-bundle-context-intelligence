bundle:
  name: context-intelligence-behavior
  version: 0.1.0
  description: |
    Context intelligence hooks for building a property graph
    from orchestrator events.

hooks:
  - module: hook-context-intelligence
    source: git+https://github.com/colombod/amplifier-bundle-context-intelligence@main#subdirectory=modules/hook-context-intelligence
    config:
      # Resolution order: explicit config -> coordinator.config -> sensible default
      # base_path: '~/.amplifier/projects'  # optional; resolved lazily if omitted
      # project_slug: 'my-project'          # optional; resolved lazily if omitted
      # project: 'my-project'              # optional; used as graph_forest_name fallback
      exclude_events: []
      log_level: 'WARNING'
      # enable_graph is intentionally omitted here.
      # The config_resolver defaults to false; users enable via:
      #   - CI_ENABLE_GRAPH=true  env var  (reliable, unaffected by YAML merge order)
      #   - enable_graph: true    in settings.yaml hooks config
      #     (requires app-cli fix for general hook overrides — see amplifier-support)
      graph_store:
        type: 'neo4j'
        # graph_forest_name: auto-resolved via coordinator.config.project_slug -> "default"
        # Set explicitly here only if you need to override the auto-resolved value
        config:
          uri: '${NEO4J_URI:bolt://localhost:7687}'
          # username / password omitted — no-auth Neo4j
          # To enable auth, set NEO4J_USERNAME and NEO4J_PASSWORD env vars
          database: '${NEO4J_DATABASE:neo4j}'

tools:
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-module-tool-skills@main
    config:
      skills:
        - git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=skills
        - context-intelligence:skills/

agents:
  include:
    - context-intelligence:context-intelligence-analyst

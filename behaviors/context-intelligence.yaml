bundle:
  name: context-intelligence-behavior
  version: 0.1.0
  description: |
    Context intelligence hooks for building a property graph
    from orchestrator events.

hooks:
  - module: hook-context-intelligence
    source: context-intelligence:modules/hook-context-intelligence
    config:
      base_path: '~/.amplifier/projects'
      exclude_events: []
      log_level: 'WARNING'
      enable_graph: false
      graph_store:
        type: 'neo4j'
        graph_forest_name: 'default'
        config:
          uri: 'bolt://localhost:7687'
          database: 'neo4j'
          # Set NEO4J_USERNAME and NEO4J_PASSWORD environment variables
          # or override username/password in your .amplifier/settings.yaml

tools:
  - module: tool-skills
    source: git+https://github.com/microsoft/amplifier-module-tool-skills@main
    config:
      skills:
        - git+https://github.com/microsoft/amplifier-bundle-skills@main#subdirectory=skills
        - context-intelligence:skills/

agents:
  include:
    - context-intelligence:context-intelligence-analyst

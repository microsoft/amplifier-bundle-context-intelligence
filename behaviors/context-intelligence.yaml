# Context Intelligence — thin event forwarder behavior
# Writes session events to local JSONL and optionally dispatches to
# the Context Intelligence server.

hooks:
  - module: hook-context-intelligence
    source: git+https://github.com/colombod/amplifier-bundle-context-intelligence@main#subdirectory=modules/hook-context-intelligence
    config:
      # Server URL (required to enable graph storage and blob tools)
      context_intelligence_server_url: "${AMPLIFIER_CONTEXT_INTELLIGENCE_SERVER_URL:}"

      # Workspace identifier — scopes graph data on the server.
      # Auto-resolved from coordinator project_slug when not set.
      workspace: "${AMPLIFIER_CONTEXT_INTELLIGENCE_WORKSPACE:}"

      # Log level for the hook itself
      log_level: "${AMPLIFIER_CONTEXT_INTELLIGENCE_LOG_LEVEL:INFO}"

      # Events to suppress from logging and dispatch (fnmatch patterns)
      # exclude_events:
      #   - "debug:*"

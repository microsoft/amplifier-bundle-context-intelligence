[project]
name = "amplifier-bundle-context-intelligence"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
amplifier-core = { git = "https://github.com/microsoft/amplifier-core", rev = "main" }
amplifier-module-tool-bundle-usage = { path = "modules/tool-bundle-usage", editable = true }

[tool.hatch.build.targets.wheel]
packages = [
    "context_intelligence",
]

[tool.hatch.build.targets.wheel.force-include]
"queries" = "context_intelligence/_queries"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "pyright>=1.1",
    "ruff>=0.4",
    "httpx>=0.25",
    "idna>=3.15",
    "PyYAML>=6.0",
    "amplifier-core",
    "amplifier-module-tool-bundle-usage",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["context_intelligence", "tests"]
extraPaths = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
